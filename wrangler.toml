name = "pocwu"
compatibility_date = "2024-07-24"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "dist"

[env.production]
vars = { ENVIRONMENT = "production", GITHUB_APP_SLUG = "opencodewebsag" }

# INTERNAL_GATEWAY_TOKEN is set as a Pages secret (not in plain text)
[[env.production.services]]
binding = "GLOBE_DO"
service = "opencodeweb"
[[env.production.kv_namespaces]]
binding = "SESSIONS_KV"
id = "f664fcc8a19745f196948cd33ea2fe28"

[[env.production.kv_namespaces]]
binding = "DEVICES_KV"
id = "9631d086c834474f8cd3ee9e65555add"

[[env.production.d1_databases]]
binding = "DB"
database_name = "opencodeabs"
database_id = "ac9be9b0-bfd3-498d-b8d8-a38f4d6ecb32"

[[env.production.kv_namespaces]]
binding = "AG_TOKENS_KV"
id = "4746613824af45aba9c043bc20cb09d7"

[[env.production.services]]
binding = "AG_WORKER"
service = "opencodeweb"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "f664fcc8a19745f196948cd33ea2fe28"

[[kv_namespaces]]
binding = "DEVICES_KV"
id = "9631d086c834474f8cd3ee9e65555add"

[[d1_databases]]
binding = "DB"
database_name = "opencodeabs"
database_id = "ac9be9b0-bfd3-498d-b8d8-a38f4d6ecb32"

# Service binding to the opencodeweb gateway (routes to pocwu-globe-relay internally)
[[services]]
binding = "GLOBE_DO"
service = "opencodeweb"

# KV namespace for AG bot tokens
[[kv_namespaces]]
binding = "AG_TOKENS_KV"
id = "4746613824af45aba9c043bc20cb09d7"

# Service binding to the OpenCodeWEB gateway (routes to AG worker internally)
[[services]]
binding = "AG_WORKER"
service = "opencodeweb"

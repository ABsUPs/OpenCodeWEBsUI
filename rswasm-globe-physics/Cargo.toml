[package]
name = "rswasm-globe-physics"
version = "0.1.0"
edition = "2021"
description = "WASM-compiled globe physics: Haversine distance, spherical interpolation, rotation"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
